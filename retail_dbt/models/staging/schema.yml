  - name: stg_suppliers
    columns:
      - name: supplier_id
        tests:
          - unique
          - not_null

  - name: stg_stores
    columns:
      - name: store_id
        tests:
          - unique
          - not_null

  - name: stg_employees
    columns:
      - name: employee_id
        tests:
          - unique
          - not_null

      - name: store_id
        tests:
          - not_null

  - name: stg_orders
