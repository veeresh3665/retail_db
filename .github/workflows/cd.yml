name: Retail Data Pipeline CD

on:
  push:
    branches:
      - main

jobs:

  deploy:
    name: Deploy Retail Data Pipeline
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}

    steps:

      - name: Checkout approved code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate Airflow DAG Python files
        run: |
          python -m compileall airflow/dags

      - name: Validate dbt project
        working-directory: retail_dbt
        run: |
          pip install dbt-core==1.12.0 dbt-snowflake==1.12.0
          dbt parse

      - name: Create deployment package
        run: |
          mkdir -p deployment
          cp -r airflow/dags deployment/airflow_dags
          cp -r retail_dbt deployment/retail_dbt

      - name: Create deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: retail-data-pipeline
          path: deployment/

      - name: Deployment successful
        run: |
          echo "====================================="
          echo "Retail Data Pipeline deployment passed"
          echo "====================================="