name: Retail Data Pipeline CD

on:
  push:
    branches:
      - main

jobs:

  deploy:
    name: Deploy Retail Data Pipeline
    runs-on: ubuntu-latest

    # ==========================================
    # Snowflake credentials
    # Available to all steps in this job
    # ==========================================
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}

    steps:

      # ==========================================
      # 1. Checkout approved code
      # ==========================================
      - name: Checkout approved code
        uses: actions/checkout@v4

      # ==========================================
      # 2. Set up Python
      # ==========================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ==========================================
      # 3. Validate Airflow DAG Python files
      # ==========================================
      - name: Validate Airflow DAG Python files
        run: |
          python -m compileall airflow/dags

      # ==========================================
      # 4. Install dbt
      # ==========================================
      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.12.0
          pip install dbt-snowflake==1.12.0

      # ==========================================
      # 5. Check dbt version
      # ==========================================
      - name: Check dbt version
        run: |
          dbt --version

      # ==========================================
      # 6. Check Snowflake environment variables
      # ==========================================
      - name: Check Snowflake configuration
        shell: bash
        run: |

          if [ -n "$SNOWFLAKE_ACCOUNT" ]; then
            echo "SNOWFLAKE_ACCOUNT = SET"
          else
            echo "SNOWFLAKE_ACCOUNT = MISSING"
            exit 1
          fi

          if [ -n "$SNOWFLAKE_USER" ]; then
            echo "SNOWFLAKE_USER = SET"
          else
            echo "SNOWFLAKE_USER = MISSING"
            exit 1
          fi

          if [ -n "$SNOWFLAKE_PASSWORD" ]; then
            echo "SNOWFLAKE_PASSWORD = SET"
          else
            echo "SNOWFLAKE_PASSWORD = MISSING"
            exit 1
          fi

          if [ -n "$SNOWFLAKE_DATABASE" ]; then
            echo "SNOWFLAKE_DATABASE = SET"
          else
            echo "SNOWFLAKE_DATABASE = MISSING"
            exit 1
          fi

          if [ -n "$SNOWFLAKE_SCHEMA" ]; then
            echo "SNOWFLAKE_SCHEMA = SET"
          else
            echo "SNOWFLAKE_SCHEMA = MISSING"
            exit 1
          fi

          if [ -n "$SNOWFLAKE_WAREHOUSE" ]; then
            echo "SNOWFLAKE_WAREHOUSE = SET"
          else
            echo "SNOWFLAKE_WAREHOUSE = MISSING"
            exit 1
          fi

          if [ -n "$SNOWFLAKE_ROLE" ]; then
            echo "SNOWFLAKE_ROLE = SET"
          else
            echo "SNOWFLAKE_ROLE = MISSING"
            exit 1
          fi

      # ==========================================
      # 7. Create dbt profiles.yml
      # ==========================================
      - name: Create dbt profiles.yml
        working-directory: retail_dbt
        shell: bash
        run: |

          cat > profiles.yml <<EOF
          retail_dbt:
            target: ci

            outputs:
              ci:
                type: snowflake
                account: "$SNOWFLAKE_ACCOUNT"
                user: "$SNOWFLAKE_USER"
                password: "$SNOWFLAKE_PASSWORD"
                database: "$SNOWFLAKE_DATABASE"
                schema: "$SNOWFLAKE_SCHEMA"
                warehouse: "$SNOWFLAKE_WAREHOUSE"
                role: "$SNOWFLAKE_ROLE"
                threads: 4
          EOF

          echo "profiles.yml created successfully."

      # ==========================================
      # 8. Install dbt packages
      # ==========================================
      - name: Install dbt dependencies
        working-directory: retail_dbt
        run: |
          dbt deps

      # ==========================================
      # 9. Test Snowflake connection
      # ==========================================
      - name: dbt debug
        working-directory: retail_dbt
        timeout-minutes: 3
        run: |
          dbt debug

      # ==========================================
      # 10. Parse dbt project
      # ==========================================
      - name: dbt parse
        working-directory: retail_dbt
        timeout-minutes: 5
        run: |
          dbt parse

      # ==========================================
      # 11. Create deployment package
      # ==========================================
      - name: Create deployment package
        run: |
          mkdir -p deployment

          cp -r airflow/dags deployment/airflow_dags
          cp -r retail_dbt deployment/retail_dbt

          echo "Deployment package created."

      # ==========================================
      # 12. Create deployment artifact
      # ==========================================
      - name: Create deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: retail-data-pipeline
          path: deployment/

      # ==========================================
      # 13. Deployment successful
      # ==========================================
      - name: Deployment successful
        run: |
          echo "====================================="
          echo "Retail Data Pipeline deployment passed"
          echo "====================================="